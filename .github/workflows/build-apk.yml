name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Normalize Keystore Alias
        run: |
          OLD_ALIAS=$(keytool -list -keystore app/folio-signing.p12 -storetype PKCS12 -storepass folioandroid | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1 | xargs)
          if [ -n "$OLD_ALIAS" ] && [ "$OLD_ALIAS" != "folio" ]; then
            keytool -changealias -keystore app/folio-signing.p12 -storetype PKCS12 -storepass folioandroid -alias "$OLD_ALIAS" -destalias folio -keypass folioandroid
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk Folio-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release (for Obtainium)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Folio v1.0.${{ github.run_number }}
          files: Folio-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Android-APK
          path: Folio-v1.0.${{ github.run_number }}.apk
          retention-days: 90
