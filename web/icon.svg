<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="warmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE9DF"/>
    </linearGradient>
    <linearGradient id="dotRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DB5245"/>
      <stop offset="100%" stop-color="#B83B2E"/>
    </linearGradient>
    <linearGradient id="dotBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B72A3"/>
      <stop offset="100%" stop-color="#25527A"/>
    </linearGradient>
    <linearGradient id="dotGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48855C"/>
      <stop offset="100%" stop-color="#316342"/>
    </linearGradient>
  </defs>

  <!-- Subtle warm gradient background -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#warmBg)"/>

  <!-- Borderless Taskito-style timeline / task rows -->
  <!-- Row 1 -->
  <circle cx="17.5" cy="20" r="4" fill="url(#dotRed)"/>
  <rect x="25.5" y="17.2" width="24" height="5.6" rx="2.8" fill="#2A2521"/>

  <!-- Row 2 (checked) -->
  <circle cx="17.5" cy="32" r="4" fill="url(#dotBlue)"/>
  <path d="M15.7 32 L17 33.3 L19.5 30.7" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="25.5" y="29.2" width="27" height="5.6" rx="2.8" fill="#3D3630"/>

  <!-- Row 3 -->
  <circle cx="17.5" cy="44" r="4" fill="url(#dotGreen)"/>
  <rect x="25.5" y="41.2" width="18" height="5.6" rx="2.8" fill="#8C8276"/>
</svg>
