<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F6FC"/>
    </linearGradient>
    <linearGradient id="backPageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8E6FF"/>
      <stop offset="100%" stop-color="#B5CEFA"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58B0FF"/>
      <stop offset="55%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#0C56D6"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8275"/>
      <stop offset="55%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#D6241B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="accentBarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#1652B8" flood-opacity="0.18"/>
    </filter>
    <filter id="ribbonShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.3" flood-color="#B91C1C" flood-opacity="0.28"/>
    </filter>
    <clipPath id="bookClip">
      <rect x="17" y="11" width="32" height="40" rx="7"/>
    </clipPath>
  </defs>

  <!-- White ceramic base -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Soft ambient back page for 3D depth -->
  <rect x="20" y="15" width="31" height="39" rx="7" fill="url(#backPageGrad)"/>

  <!-- Main 3D Notebook Card -->
  <g filter="url(#cardShadow)">
    <rect x="17" y="11" width="32" height="40" rx="7" fill="url(#bodyGrad)"/>
    <g clip-path="url(#bookClip)">
      <!-- Aquamorphic Blue Gradient Header -->
      <rect x="17" y="11" width="32" height="12.5" fill="url(#headerGrad)"/>
      <!-- Subtle specular gloss over top-left -->
      <path d="M17 11 H49 V23.5 L17 19 Z" fill="url(#glossGrad)"/>
    </g>
    <!-- Crisp inner highlight border -->
    <rect x="17.5" y="11.5" width="31" height="39" rx="6.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1"/>
  </g>

  <!-- Planner content lines -->
  <circle cx="25.5" cy="31" r="2.2" fill="url(#accentBarGrad)"/>
  <rect x="30" y="29.4" width="13.5" height="3.2" rx="1.6" fill="#2A3447" fill-opacity="0.85"/>
  <circle cx="25.5" cy="39" r="2.2" fill="#94A3B8" fill-opacity="0.7"/>
  <rect x="30" y="37.4" width="10" height="3.2" rx="1.6" fill="#64748B" fill-opacity="0.55"/>

  <!-- 3D Bookmark Ribbon -->
  <g filter="url(#ribbonShadow)">
    <path d="M37 11 V26.5 L40.5 23.6 L44 26.5 V11 Z" fill="url(#ribbonGrad)"/>
    <path d="M37.7 11 V25.2 L40.5 22.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.9"/>
  </g>

  <!-- 3D Metallic Binder Rings -->
  <g>
    <circle cx="19.5" cy="21" r="1.8" fill="#1E3A8A" fill-opacity="0.28"/>
    <rect x="12.5" y="19.4" width="8" height="3.2" rx="1.6" fill="url(#ringGrad)"/>

    <circle cx="19.5" cy="31" r="1.8" fill="#1E3A8A" fill-opacity="0.2"/>
    <rect x="12.5" y="29.4" width="8" height="3.2" rx="1.6" fill="url(#ringGrad)"/>

    <circle cx="19.5" cy="41" r="1.8" fill="#1E3A8A" fill-opacity="0.2"/>
    <rect x="12.5" y="39.4" width="8" height="3.2" rx="1.6" fill="url(#ringGrad)"/>
  </g>
</svg>
