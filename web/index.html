<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Folio — Digital Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%23161616'/%3E%3Cpath d='M22 20h15M22 32h10M22 20v24' stroke='%23F5F4F0' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='43' cy='20' r='3.2' fill='%23D71920'/%3E%3Ccircle cx='43' cy='32' r='2.4' fill='%236B6965'/%3E%3Ccircle cx='33' cy='44' r='2.4' fill='%236B6965'/%3E%3Ccircle cx='43' cy='44' r='2.4' fill='%234A4946'/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#FAF8F4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Folio" />

  <link rel="apple-touch-icon" href="/icon.svg" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #DAD2C5;
      color: #231F1C;
      font-family: 'Inter', 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    input, textarea, select {
      user-select: text;
    }

    .planner-cover {
      background: radial-gradient(circle at 20% 15%, #E6DFD3 0%, #D5CCC0 55%, #C6BCB0 100%);
    }

    .planner-sheet {
      background: linear-gradient(180deg, #FCFBF8 0%, #F7F3EC 100%);
      box-shadow:
        -10px 0 28px -6px rgba(35, 31, 28, 0.14),
        0 24px 54px -14px rgba(35, 31, 28, 0.22),
        0 6px 14px -4px rgba(35, 31, 28, 0.08),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95);
    }

    .index-tab {
      background: linear-gradient(180deg, #EFEAE1 0%, #E3DDD2 100%);
      color: #635B52;
      border-top: 1px solid rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(35, 31, 28, 0.08);
      border-left: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        -4px 4px 10px -2px rgba(35, 31, 28, 0.10),
        inset 1px 1px 0 rgba(255, 255, 255, 0.65);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .index-tab:hover {
      background: linear-gradient(180deg, #F7F3EC 0%, #ECE6DC 100%);
      color: #231F1C;
      transform: translateX(-3px);
    }
    .index-tab-active {
      background: linear-gradient(90deg, #FCFBF8 0%, #F9F6F0 100%);
      color: #231F1C;
      font-weight: 700;
      box-shadow:
        -6px 4px 14px -2px rgba(35, 31, 28, 0.14),
        inset 1px 1.5px 0 rgba(255, 255, 255, 0.95);
      z-index: 30;
      transform: translateX(-6px);
    }

    .day-tile {
      background: linear-gradient(180deg, #FFFFFF 0%, #F9F6F0 100%);
      border: 1px solid rgba(214, 208, 198, 0.65);
      box-shadow:
        0 3px 10px -3px rgba(35, 31, 28, 0.06),
        0 1px 3px rgba(35, 31, 28, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, background 0.18s ease;
    }
    .day-tile:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, #F4EFE6 100%);
      transform: translateY(-2px);
      box-shadow:
        0 10px 20px -6px rgba(35, 31, 28, 0.12),
        0 3px 6px -2px rgba(35, 31, 28, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .day-tile-slot {
      background-color: rgba(235, 230, 221, 0.25);
    }

    .soft-card-3d {
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F4EC 100%);
      border: 1px solid rgba(214, 208, 198, 0.65);
      box-shadow:
        0 8px 22px -6px rgba(35, 31, 28, 0.08),
        0 2px 6px -1px rgba(35, 31, 28, 0.04),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95);
    }

    .pill-track {
      background-color: #EAE4DA;
      box-shadow:
        inset 0 2px 5px rgba(35, 31, 28, 0.09),
        0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .pill-thumb {
      background: linear-gradient(180deg, #FFFFFF 0%, #F7F3EC 100%);
      box-shadow:
        0 3px 8px -1px rgba(35, 31, 28, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .grid-hairline {
      border-color: #E2DCD2;
    }

    .today-cell-frame {
      background: linear-gradient(180deg, #FFFDF9 0%, #F6EFE3 100%) !important;
      border: 2.5px solid #2A231D !important;
      box-shadow:
        0 10px 24px -6px rgba(35, 31, 28, 0.18),
        0 3px 8px -2px rgba(35, 31, 28, 0.08),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95) !important;
      z-index: 10;
    }

    .paper-ruled {
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 35px,
        #E6E1D8 35px,
        #E6E1D8 36px
      );
      line-height: 36px;
    }
    .paper-dots {
      background-image: radial-gradient(#CBC4B9 1px, transparent 1px);
      background-size: 20px 20px;
      line-height: 30px;
    }

    .m3-fab {
      box-shadow:
        0 14px 28px -6px rgba(35, 31, 28, 0.28),
        0 6px 12px -3px rgba(35, 31, 28, 0.14),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.25);
    }
    .m3-fab-light {
      background: linear-gradient(180deg, #FFFFFF 0%, #F2ECE2 100%);
      box-shadow:
        0 12px 26px -6px rgba(35, 31, 28, 0.20),
        0 4px 10px -2px rgba(35, 31, 28, 0.10),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95);
    }
    .m3-fab-dark {
      background: linear-gradient(180deg, #564D43 0%, #3A322B 100%);
      box-shadow:
        0 14px 28px -6px rgba(35, 31, 28, 0.34),
        0 6px 12px -3px rgba(35, 31, 28, 0.18),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.22);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D0C9BE; border-radius: 9999px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes folioSlideFromRight {
      from { opacity: 0.35; transform: translateX(34px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes folioSlideFromLeft {
      from { opacity: 0.35; transform: translateX(-34px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes folioSheetUp {
      from { opacity: 0.4; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes folioSheetDown {
      from { opacity: 0.45; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes folioDayFade {
      from { opacity: 0.35; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-slide-right { animation: folioSlideFromRight 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
    .anim-slide-left { animation: folioSlideFromLeft 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
    .anim-sheet-up { animation: folioSheetUp 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
    .anim-sheet-down { animation: folioSheetDown 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
    .anim-day-fade { animation: folioDayFade 0.2s cubic-bezier(0.22, 1, 0.36, 1); }

    /* Dark Mode Theme */
    html[data-theme="dark"] body {
      background-color: #101012;
      color: #F2EFE9;
    }
    html[data-theme="dark"] .planner-cover {
      background: radial-gradient(circle at 20% 15%, #1E1E22 0%, #141416 60%, #0D0D0F 100%);
    }
    html[data-theme="dark"] .planner-sheet {
      background: linear-gradient(180deg, #1A1A1D 0%, #151518 100%);
      border-color: rgba(255, 255, 255, 0.08) !important;
      box-shadow: 0 24px 54px -14px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    html[data-theme="dark"] .index-tab {
      background: linear-gradient(180deg, #242428 0%, #1C1C20 100%);
      color: #B4AEA4;
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: -4px 4px 10px -2px rgba(0, 0, 0, 0.4);
    }
    html[data-theme="dark"] .index-tab:hover {
      background: linear-gradient(180deg, #2E2E33 0%, #242428 100%);
      color: #F5F2EC;
    }
    html[data-theme="dark"] .index-tab-active {
      background: linear-gradient(90deg, #26262B 0%, #1D1D21 100%);
      color: #FFFFFF;
      box-shadow: -6px 4px 14px -2px rgba(0, 0, 0, 0.55), inset 1px 1px 0 rgba(255, 255, 255, 0.12);
    }
    html[data-theme="dark"] .day-tile {
      background: linear-gradient(180deg, #222226 0%, #1B1B1E 100%);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 3px 10px -3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    html[data-theme="dark"] .day-tile:hover {
      background: linear-gradient(180deg, #29292E 0%, #202024 100%);
    }
    html[data-theme="dark"] .day-tile-slot {
      background-color: rgba(255, 255, 255, 0.03);
    }
    html[data-theme="dark"] .soft-card-3d {
      background: linear-gradient(180deg, #232327 0%, #1B1B1F 100%);
      border-color: rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 22px -6px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    html[data-theme="dark"] .pill-track {
      background-color: #121214;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    html[data-theme="dark"] .pill-thumb {
      background: linear-gradient(180deg, #323238 0%, #26262B 100%);
      color: #F2EFE9 !important;
      box-shadow: 0 3px 8px -1px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }
    html[data-theme="dark"] .grid-hairline {
      border-color: rgba(255, 255, 255, 0.10);
    }
    html[data-theme="dark"] .today-cell-frame {
      background: linear-gradient(180deg, #2D2A24 0%, #23201B 100%) !important;
      border: 2.5px solid #E8DFD1 !important;
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.55) !important;
    }
    html[data-theme="dark"] .paper-ruled {
      background-image: repeating-linear-gradient(to bottom, transparent, transparent 35px, rgba(255, 255, 255, 0.08) 35px, rgba(255, 255, 255, 0.08) 36px);
    }
    html[data-theme="dark"] .paper-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px);
    }
    html[data-theme="dark"] .m3-fab-light {
      background: linear-gradient(180deg, #2E2E34 0%, #222226 100%);
      color: #F2EFE9 !important;
      border-color: rgba(255, 255, 255, 0.14) !important;
    }
    html[data-theme="dark"] .m3-fab-dark {
      background: linear-gradient(180deg, #F2EFE9 0%, #DDD7CC 100%);
      color: #181512 !important;
    }
    html[data-theme="dark"] .text-\[\#181512\],
    html[data-theme="dark"] .text-\[\#231F1C\] { color: #F2EFE9 !important; }
    html[data-theme="dark"] .text-\[\#2B2622\],
    html[data-theme="dark"] .text-\[\#38322D\],
    html[data-theme="dark"] .text-\[\#4A443E\],
    html[data-theme="dark"] .text-\[\#5C554D\] { color: #D4CEC4 !important; }
    html[data-theme="dark"] .text-\[\#47413B\],
    html[data-theme="dark"] .text-\[\#59524A\],
    html[data-theme="dark"] .text-\[\#6E665E\],
    html[data-theme="dark"] .text-\[\#8C847A\],
    html[data-theme="dark"] .text-\[\#968E83\] { color: #A8A196 !important; }
    html[data-theme="dark"] .bg-\[\#EFECE6\],
    html[data-theme="dark"] .bg-\[\#F4EFE7\],
    html[data-theme="dark"] .bg-\[\#EFEAE1\]\/70,
    html[data-theme="dark"] .bg-\[\#EFEAE1\]\/80,
    html[data-theme="dark"] .bg-white\/90,
    html[data-theme="dark"] .bg-white\/80 {
      background-color: #28282D !important;
      color: #F2EFE9 !important;
    }
    html[data-theme="dark"] .border-\[\#E5DFD5\],
    html[data-theme="dark"] .border-\[\#D6D0C6\],
    html[data-theme="dark"] .border-white\/60,
    html[data-theme="dark"] .border-white\/70 {
      border-color: rgba(255, 255, 255, 0.11) !important;
    }
    html[data-theme="dark"] input,
    html[data-theme="dark"] textarea,
    html[data-theme="dark"] select {
      color: #F2EFE9 !important;
    }
    html[data-theme="dark"] input::placeholder,
    html[data-theme="dark"] textarea::placeholder {
      color: #8E877D !important;
    }
  </style>
</head>

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          if (reg.waiting && navigator.serviceWorker.controller) {
            state.swUpdateReady = true;
            render();
          }
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                state.swUpdateReady = true;
                render();
              }
            });
          });
        }).catch(() => {});
      });
    }
  </script>
