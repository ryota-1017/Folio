  <style>
    body {
      background-color: #EBE7DF;
      color: #1D1D1F;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, select {
      user-select: text;
    }
    .font-brand {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    }

    /* Warm Apple-inspired Soft 3D Surfaces */
    .planner-cover {
      background: radial-gradient(circle at 18% 12%, #F4F1EB 0%, #EAE5DC 58%, #E1DBD0 100%);
    }

    .planner-sheet {
      background: linear-gradient(180deg, #FEFDFB 0%, #FAF8F4 100%);
      box-shadow:
        0 24px 60px -18px rgba(29, 29, 31, 0.14),
        0 6px 18px -6px rgba(29, 29, 31, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
    }

    .index-tab {
      background: linear-gradient(180deg, #F3EFE8 0%, #EAE4DA 100%);
      color: #6B655E;
      border-top: 1px solid rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(29, 29, 31, 0.05);
      border-left: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow:
        -3px 3px 10px -3px rgba(29, 29, 31, 0.07),
        inset 1px 1px 0 rgba(255, 255, 255, 0.7);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .index-tab:hover {
      background: linear-gradient(180deg, #FAF8F4 0%, #F1ECE3 100%);
      color: #1D1D1F;
      transform: translateX(-3px);
    }
    .index-tab-active {
      background: linear-gradient(90deg, #FEFDFB 0%, #FBF9F5 100%);
      color: #1D1D1F;
      font-weight: 700;
      box-shadow:
        -6px 4px 16px -3px rgba(29, 29, 31, 0.10),
        inset 1px 1.5px 0 rgba(255, 255, 255, 0.98);
      z-index: 30;
      transform: translateX(-6px);
    }

    .day-tile {
      background: linear-gradient(180deg, #FFFFFF 0%, #FCFBF8 100%);
      border: 1px solid rgba(29, 29, 31, 0.065);
      box-shadow:
        0 2px 8px -3px rgba(29, 29, 31, 0.05),
        0 1px 2px rgba(29, 29, 31, 0.02),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, background 0.2s ease;
    }
    .day-tile:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, #F7F4EE 100%);
      transform: translateY(-2px);
      box-shadow:
        0 10px 22px -8px rgba(29, 29, 31, 0.11),
        0 2px 6px -2px rgba(29, 29, 31, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .day-tile-slot {
      background-color: rgba(235, 230, 222, 0.28);
    }

    .soft-card-3d {
      background: linear-gradient(180deg, #FFFFFF 0%, #FAF8F3 100%);
      border: 1px solid rgba(29, 29, 31, 0.065);
      box-shadow:
        0 10px 26px -10px rgba(29, 29, 31, 0.09),
        0 2px 6px -2px rgba(29, 29, 31, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
    }

    .pill-track {
      background-color: rgba(232, 227, 218, 0.85);
      box-shadow:
        inset 0 1.5px 4px rgba(29, 29, 31, 0.07),
        0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .pill-thumb {
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F6F1 100%);
      box-shadow:
        0 2px 8px -2px rgba(29, 29, 31, 0.12),
        0 1px 2px rgba(29, 29, 31, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
    }

    .grid-hairline {
      border-color: rgba(29, 29, 31, 0.08);
    }

    .today-cell-frame {
      background: linear-gradient(180deg, #F0E9DC 0%, #E7DEC9 100%) !important;
      border: 1px solid rgba(138, 124, 102, 0.42) !important;
      box-shadow:
        0 4px 12px -4px rgba(29, 29, 31, 0.09),
        inset 0 1px 0 rgba(255, 255, 255, 0.78) !important;
    }

    .selected-day-ring {
      box-shadow: 0 0 0 2px #1D1D1F !important;
      border-color: transparent !important;
    }

    .paper-ruled {
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 35px,
        #E9E5DD 35px,
        #E9E5DD 36px
      );
      line-height: 36px;
    }
    .paper-dots {
      background-image: radial-gradient(#CFC9BE 1px, transparent 1px);
      background-size: 20px 20px;
      line-height: 30px;
    }

    .m3-fab {
      box-shadow:
        0 18px 36px -10px rgba(29, 29, 31, 0.22),
        0 6px 14px -4px rgba(29, 29, 31, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .m3-fab-light {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 10px 24px -6px rgba(29, 29, 31, 0.14),
        0 3px 8px -2px rgba(29, 29, 31, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }
    .m3-fab-dark {
      background: linear-gradient(180deg, #32312F 0%, #1C1B1A 100%);
      color: #FFFFFF !important;
      box-shadow:
        0 14px 28px -6px rgba(29, 29, 31, 0.34),
        0 5px 12px -3px rgba(29, 29, 31, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.20);
    }

    /* Floating Glass Notification Popup */
    .vellora-toast {
      background: rgba(255, 255, 255, 0.90);
      color: #1D1D1F;
      transform: translateX(-50%);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(29, 29, 31, 0.09);
      box-shadow:
        0 18px 42px -12px rgba(29, 29, 31, 0.22),
        0 4px 12px -2px rgba(29, 29, 31, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }
    .vellora-toast-btn {
      background: rgba(29, 29, 31, 0.08);
      color: #1D1D1F;
    }
    .vellora-toast-btn:hover {
      background: rgba(29, 29, 31, 0.14);
    }
    .mobile-sheet-surface {
      background: linear-gradient(180deg, #FEFDFB 0%, #FAF8F4 100%);
    }
    .mobile-sheet-dragging {
      box-shadow: 0 -18px 44px -10px rgba(29, 29, 31, 0.22), 0 -2px 8px rgba(29, 29, 31, 0.08);
    }

    /* Splash Start Screen */
    #vellora-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #FAF8F3 0%, #EFEBE3 65%, #E6E0D5 100%);
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s;
    }
    #vellora-splash.splash-hidden {
      opacity: 0;
      transform: scale(1.035);
      visibility: hidden;
      pointer-events: none;
    }
    @keyframes splashBarSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(220%); }
    }
    .splash-progress-bar {
      animation: splashBarSlide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D0C9BE; border-radius: 9999px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animations */
    @keyframes folioFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes folioSlideFromRight {
      from { opacity: 0.2; transform: translateX(42px) scale(0.985); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes folioSlideFromLeft {
      from { opacity: 0.2; transform: translateX(-42px) scale(0.985); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes folioSheetUp {
      from { opacity: 0.15; transform: translateY(34px) scale(0.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioSheetDown {
      from { opacity: 0.25; transform: translateY(-22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioDayFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes folioModePop {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes folioModalPop {
      from { opacity: 0; transform: translateY(18px) scale(0.93); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes folioToastDrop {
      from { opacity: 0; transform: translate(-50%, -24px) scale(0.92); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    @keyframes folioExpandIn {
      from { opacity: 0; transform: translateY(-6px) scaleY(0.95); }
      to { opacity: 1; transform: translateY(0) scaleY(1); }
    }
    @keyframes folioCardCascade {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioLiveGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(54, 107, 71, 0.35); }
      50% { box-shadow: 0 0 0 5px rgba(54, 107, 71, 0); }
    }
    @keyframes folioTodayPulse {
      0% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(138, 124, 102, 0.55); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(138, 124, 102, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(138, 124, 102, 0); }
    }
    @keyframes folioCheckPop {
      0% { transform: scale(0.5); }
      55% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    @keyframes folioStrikeDraw {
      from { opacity: 1; text-decoration-color: transparent; }
      to { opacity: 0.65; text-decoration: line-through; text-decoration-color: currentColor; }
    }
    @keyframes folioTilePop {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-fade-in { animation: folioFadeIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-slide-right { animation: folioSlideFromRight 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-slide-left { animation: folioSlideFromLeft 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-sheet-up { animation: folioSheetUp 0.30s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-sheet-down { animation: folioSheetDown 0.26s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-day-fade { animation: folioDayFade 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-mode-pop { animation: folioModePop 0.26s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-modal-pop { animation: folioModalPop 0.30s cubic-bezier(0.34, 1.32, 0.64, 1) both; }
    .anim-backdrop-in { animation: folioBackdropFade 0.18s ease-out both; }
    .anim-toast-drop { animation: folioToastDrop 0.32s cubic-bezier(0.34, 1.32, 0.64, 1) both; }
    .anim-expand-in { transform-origin: top center; animation: folioExpandIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-card-in { animation: folioCardCascade 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-tile-pop { animation: folioTilePop 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-today-pulse { animation: folioTodayPulse 0.58s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-check-pop { animation: folioCheckPop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .anim-strike-draw { text-decoration: line-through; animation: folioStrikeDraw 0.32s ease-out both; }
    .anim-live-glow { animation: folioLiveGlow 2.2s ease-in-out infinite; }
    button, .day-tile, .soft-card-3d, .pill-thumb {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
    }
    button:active, .day-tile:active {
      transform: scale(0.96);
    }

    /* Dark Mode Theme (Warm Apple Graphite) */

      background-color: #0E0E10;
      color: #F4F2ED;

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          if (reg.waiting && navigator.serviceWorker.controller) {
            state.swUpdateReady = true;
            render();
          }
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                state.swUpdateReady = true;
                render();
              }
            });
          });
        }).catch(() => {});
      });
    }
