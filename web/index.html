<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Folio — Digital Planner</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="theme-color" content="#FAF8F4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Folio" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #DAD2C5;
      color: #231F1C;
      font-family: 'Inter', 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    input, textarea, select {
      user-select: text;
    }

    .planner-cover {
      background: radial-gradient(circle at 20% 15%, #E6DFD3 0%, #D5CCC0 55%, #C6BCB0 100%);
    }

    .planner-sheet {
      background: linear-gradient(180deg, #FCFBF8 0%, #F7F3EC 100%);
      box-shadow:
        -10px 0 28px -6px rgba(35, 31, 28, 0.14),
        0 24px 54px -14px rgba(35, 31, 28, 0.22),
        0 6px 14px -4px rgba(35, 31, 28, 0.08),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95);
    }

    .index-tab {
      background: linear-gradient(180deg, #EFEAE1 0%, #E3DDD2 100%);
      color: #635B52;
      border-top: 1px solid rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(35, 31, 28, 0.08);
      border-left: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        -4px 4px 10px -2px rgba(35, 31, 28, 0.10),
        inset 1px 1px 0 rgba(255, 255, 255, 0.65);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .index-tab:hover {
      background: linear-gradient(180deg, #F7F3EC 0%, #ECE6DC 100%);
      color: #231F1C;
      transform: translateX(-3px);
    }
    .index-tab-active {
      background: linear-gradient(90deg, #FCFBF8 0%, #F9F6F0 100%);
      color: #231F1C;
      font-weight: 700;
      box-shadow:
        -6px 4px 14px -2px rgba(35, 31, 28, 0.14),
        inset 1px 1.5px 0 rgba(255, 255, 255, 0.95);
      z-index: 30;
      transform: translateX(-6px);
    }

    .day-tile {
      background: linear-gradient(180deg, #FFFFFF 0%, #F9F6F0 100%);
      border: 1px solid rgba(214, 208, 198, 0.65);
      box-shadow:
        0 3px 10px -3px rgba(35, 31, 28, 0.06),
        0 1px 3px rgba(35, 31, 28, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, background 0.18s ease;
    }
    .day-tile:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, #F4EFE6 100%);
      transform: translateY(-2px);
      box-shadow:
        0 10px 20px -6px rgba(35, 31, 28, 0.12),
        0 3px 6px -2px rgba(35, 31, 28, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .day-tile-slot {
      background-color: rgba(235, 230, 221, 0.25);
    }

    .soft-card-3d {
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F4EC 100%);
      border: 1px solid rgba(214, 208, 198, 0.65);
      box-shadow:
        0 8px 22px -6px rgba(35, 31, 28, 0.08),
        0 2px 6px -1px rgba(35, 31, 28, 0.04),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95);
    }

    .pill-track {
      background-color: #EAE4DA;
      box-shadow:
        inset 0 2px 5px rgba(35, 31, 28, 0.09),
        0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .pill-thumb {
      background: linear-gradient(180deg, #FFFFFF 0%, #F7F3EC 100%);
      box-shadow:
        0 3px 8px -1px rgba(35, 31, 28, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .grid-hairline {
      border-color: #E2DCD2;
    }

    .today-cell-frame {
      background: linear-gradient(180deg, #EBE3D5 0%, #DFD5C3 100%) !important;
      border: 1px solid rgba(140, 128, 112, 0.55) !important;
      box-shadow:
        0 3px 10px -3px rgba(35, 31, 28, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.7) !important;
    }

    .selected-day-ring {
      box-shadow: 0 0 0 2px #231F1C !important;
      border-color: transparent !important;
    }

    .paper-ruled {
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 35px,
        #E6E1D8 35px,
        #E6E1D8 36px
      );
      line-height: 36px;
    }
    .paper-dots {
      background-image: radial-gradient(#CBC4B9 1px, transparent 1px);
      background-size: 20px 20px;
      line-height: 30px;
    }

    .m3-fab {
      box-shadow:
        0 14px 28px -6px rgba(35, 31, 28, 0.28),
        0 6px 12px -3px rgba(35, 31, 28, 0.14),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.25);
    }
    .m3-fab-light {
      background: linear-gradient(180deg, #FFFFFF 0%, #F2ECE2 100%);
      box-shadow:
        0 12px 26px -6px rgba(35, 31, 28, 0.20),
        0 4px 10px -2px rgba(35, 31, 28, 0.10),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95);
    }
    .m3-fab-dark {
      background: linear-gradient(180deg, #564D43 0%, #3A322B 100%);
      box-shadow:
        0 14px 28px -6px rgba(35, 31, 28, 0.34),
        0 6px 12px -3px rgba(35, 31, 28, 0.18),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.22);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D0C9BE; border-radius: 9999px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes folioSlideFromRight {
      from { opacity: 0.25; transform: translateX(42px) scale(0.985); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes folioSlideFromLeft {
      from { opacity: 0.25; transform: translateX(-42px) scale(0.985); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes folioSheetUp {
      from { opacity: 0.25; transform: translateY(32px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioSheetDown {
      from { opacity: 0.35; transform: translateY(-24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioDayFade {
      from { opacity: 0.25; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes folioModePop {
      from { opacity: 0.3; transform: scale(0.965); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes folioModalPop {
      from { opacity: 0; transform: translateY(18px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes folioToastDrop {
      from { opacity: 0; transform: translate(-50%, -20px) scale(0.94); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    @keyframes folioExpandIn {
      from { opacity: 0; transform: translateY(-8px) scaleY(0.94); }
      to { opacity: 1; transform: translateY(0) scaleY(1); }
    }
    @keyframes folioCardCascade {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes folioLiveGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(54, 107, 71, 0.35); }
      50% { box-shadow: 0 0 0 5px rgba(54, 107, 71, 0); }
    }
    @keyframes folioCheckPop {
      0% { transform: scale(0.6); }
      55% { transform: scale(1.24); }
      100% { transform: scale(1); }
    }
    @keyframes folioStrikeDraw {
      from { background-size: 0% 1.5px; }
      to { background-size: 100% 1.5px; }
    }
    @keyframes folioTodayPulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 119, 255, 0.55); transform: scale(0.97); }
      45% { box-shadow: 0 0 0 8px rgba(22, 119, 255, 0.18); transform: scale(1.02); }
      100% { box-shadow: 0 0 0 12px rgba(22, 119, 255, 0); transform: scale(1); }
    }
    .anim-slide-right { animation: folioSlideFromRight 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-slide-left { animation: folioSlideFromLeft 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-sheet-up { animation: folioSheetUp 0.26s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-sheet-down { animation: folioSheetDown 0.25s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-day-fade { animation: folioDayFade 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-mode-pop { animation: folioModePop 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-modal-pop { animation: folioModalPop 0.28s cubic-bezier(0.34, 1.35, 0.64, 1) both; }
    .anim-backdrop-in { animation: folioBackdropFade 0.18s ease-out both; }
    .anim-toast-drop { animation: folioToastDrop 0.28s cubic-bezier(0.34, 1.35, 0.64, 1) both; }
    .anim-expand-in { transform-origin: top center; animation: folioExpandIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-card-in { animation: folioCardCascade 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-live-glow { animation: folioLiveGlow 2.2s ease-in-out infinite; }
    .anim-check-pop { animation: folioCheckPop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .anim-strike-draw {
      display: inline;
      text-decoration: none !important;
      background-image: linear-gradient(currentColor, currentColor);
      background-repeat: no-repeat;
      background-position: left center;
      background-size: 100% 1.5px;
      animation: folioStrikeDraw 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .anim-today-pulse { animation: folioTodayPulse 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }
    button, .day-tile, .soft-card-3d, .pill-thumb {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
    }
    button:active, .day-tile:active {
      transform: scale(0.96);
    }

    /* Dark Mode Theme (ColorOS AMOLED Dark) */
    html[data-theme="dark"] body {
      background-color: #000000;
      color: #F2F4F7;
    }
    html[data-theme="dark"] .planner-cover {
      background: #000000;
    }
    html[data-theme="dark"] .planner-sheet {
      background: #141416;

    }
    html[data-theme="dark"] .index-tab {

    html[data-theme="dark"] .day-tile {

    html[data-theme="dark"] .selected-day-ring {

    html[data-theme="dark"] .m3-fab-light {

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          if (reg.waiting && navigator.serviceWorker.controller) {
            state.swUpdateReady = true;
            render();
          }
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                state.swUpdateReady = true;
                render();
              }
            });
          });
        }).catch(() => {});
      });
    }
  </script>
